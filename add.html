<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <nav class="bg-blue-600 text-white shadow">
      <div
        class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between"
      >
        <strong>WEB2064 JSNC</strong>

        <div class="hidden md:flex items-center space-x-8">
          <a href="index.html" class="hover:text-gray-200">
            Danh sách
          </a>

          <a href="add.html" class="hover:text-gray-200">
            Thêm mới
          </a>
        </div>
      </div>
    </nav>

    <div class="max-w-6xl mx-auto mt-10 px-4">
      <h1 class="text-2xl font-semibold mb-6 text-center">
        Thêm sinh viên
      </h1>

      <form class="space-y-6" id="form-add">
        <!-- Name -->
        <div>
          <label for="name" class="block font-medium mb-1">
            Họ tên
          </label>

          <input
            type="text"
            id="name"
            name="name"
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Nhập họ tên"
          />
        </div>

        <!-- Age -->
        <div>
          <label for="age" class="block font-medium mb-1">
            Tuổi
          </label>

          <input
            type="number"
            id="age"
            name="age"
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Nhập tuổi"
          />
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block font-medium mb-1">
            Email
          </label>

          <input
            type="email"
            id="email"
            name="email"
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Nhập email"
          />
        </div>

        <!-- Button -->
        <button
          type="submit"
          class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
        >
          Thêm sinh viên
        </button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./add.js"></script>
  </body>
</html>
